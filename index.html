<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>For You ❤️</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      font-family: 'Poppins', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      color: #fff;
      text-align: center;
    }
    .card {
      background: rgba(255, 255, 255, 0.15);
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      max-width: 350px;
    }
    h1 {
      font-size: 26px;
      margin-bottom: 10px;
    }
    p {
      font-size: 16px;
      margin-bottom: 20px;
    }
    button {
      padding: 12px 20px;
      border: none;
      border-radius: 25px;
      font-size: 16px;
      cursor: pointer;
      margin: 10px;
    }
    .yes {
      background: #ff4d6d;
      color: white;
    }
    .no {
      background: #fff;
      color: #ff4d6d;
      position: relative;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>

  <div class="card" id="step1">
    <h1>Hey Chinnu ❤️</h1>
    <p>I have something important to ask you…</p>
    <button class="yes" onclick="nextStep()">Continue 💌</button>
  </div>

  <div class="card hidden" id="step2">
    <h1>Will you be my Valentine? 💘</h1>
    <button class="yes" onclick="yesClicked()">YES 😍</button>
    <button class="no" onmouseover="moveButton(this)">NO 🙄</button>
  </div>

  <div class="card hidden" id="step3">
    <h1>YAYYYY 🥰💖</h1>
    <p>I love you naanaaaa ❤️.</p>
    <p>Happy Valentine’s Day ❤️.</p>
    <p> Now take me on a date babe ❤️.</p>
    <p><img src="animation.gif" alt="Love You Kanna"></p>
  </div>

  <script>
    function nextStep() {
      document.getElementById("step1").classList.add("hidden");
      document.getElementById("step2").classList.remove("hidden");
    }

    function yesClicked() {
      document.getElementById("step2").classList.add("hidden");
      document.getElementById("step3").classList.remove("hidden");
    }

    function moveButton(btn) {
      btn.style.position = "absolute";
      btn.style.left = Math.random() * 200 + "px";
      btn.style.top = Math.random() * 200 + "px";
    }
  </script>

</body>
</html>
